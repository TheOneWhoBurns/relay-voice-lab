<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Voice call demo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <div class="topline"><h1>Voice call demo</h1><span id="api-status">Checking API…</span></div>

  <section class="setup">
    <h2>Configuration</h2>
    <div class="mode-tabs" role="tablist" aria-label="Call direction">
      <button role="tab" aria-selected="true" data-mode="outbound">Outbound</button>
      <button role="tab" aria-selected="false" data-mode="inbound">Inbound</button>
    </div>

    <div class="grid">
      <label>Decision model<select id="model"></select><small id="model-hint"></small></label>
      <label>Voice<select id="voice"><option value="marin">Marin</option><option value="cedar">Cedar</option><option value="gleam">Gleam</option><option value="meridian">Meridian</option><option value="quartz">Quartz</option><option value="vesper">Vesper</option><option value="willow">Willow</option><option value="bossa">Bossa</option></select></label>
      <label>Language<select id="language"><option value="es">Español</option><option value="en">English</option></select></label>
      <label>Call limit<select id="limit"><option value="1">1 minute</option><option value="3">3 minutes</option><option value="5">5 minutes</option><option value="10">10 minutes</option></select></label>
    </div>

    <label>Opening<textarea id="greeting" rows="2"></textarea></label>

    <details><summary>Prompts</summary>
      <label>Live prompt<textarea id="prompt" rows="7"></textarea></label>
      <label>Pi prompt<textarea id="backend-prompt" rows="9"></textarea></label>
    </details>

    <details><summary>Tools</summary><div id="tools"></div></details>

    <details><summary>Business context</summary>
      <label>Name<input id="business-name" maxlength="120"></label>
      <label>Timezone<input id="business-timezone"></label>
      <label>Scenario<textarea id="business-brief" rows="4"></textarea></label>
      <label>Approved facts<textarea id="business-facts" rows="7"></textarea></label>
    </details>

    <details><summary>Research context</summary>
      <textarea id="research-backend" rows="10" readonly></textarea>
      <small id="research-status"></small>
    </details>

    <details><summary>Cost setting</summary>
      <label>Voice USD / minute<input id="voice-rate" type="number" min="0" max="10" step="0.01"></label>
    </details>

    <div class="buttons">
      <button id="save">Save</button>
      <button id="reset" type="button">Reset configuration</button>
      <span id="save-status">Saved</span>
    </div>
  </section>

  <section>
    <h2>Call</h2>
    <div class="statusline">
      <strong id="call-status">Ready</strong>
      <span id="timer">00:00</span>
    </div>
    <div class="buttons">
      <button id="start">Start outbound call</button>
      <button id="answer" hidden>Answer</button>
      <button id="mute" hidden>Mute microphone</button>
      <button id="end" hidden>End call</button>
    </div>
    <audio id="remote-audio" autoplay controls hidden></audio>
    <div id="error" role="alert" hidden></div>
    <dl>
      <div><dt>Backend</dt><dd id="backend-state">Idle</dd></div>
      <div><dt>Usage</dt><dd id="usage">—</dd></div>
      <div><dt>Live context</dt><dd id="context-usage">—</dd></div>
      <div><dt>Actions</dt><dd id="action-count">0</dd></div>
      <div><dt>Estimated cost</dt><dd id="call-cost">$0.0000</dd></div>
    </dl>
    <span id="cost-breakdown"></span>
  </section>

  <section>
    <h2>Transcript</h2>
    <div id="transcript" class="feed"></div>
    <details>
      <summary>Events (<span id="activity-count">0</span>)</summary>
      <div id="activity" class="feed"></div>
    </details>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
